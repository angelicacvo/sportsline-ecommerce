# SonarQube Configuration
sonar.projectKey=sportsline-ecommerce
sonar.projectName=Sportsline E-Commerce
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src
sonar.tests=test

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.e2e-spec.ts

# Test coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/main.ts,**/*.module.ts,**/*.dto.ts,**/*.entity.ts,**/*.interface.ts

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Host and authentication (configure based on your SonarQube server)
# sonar.host.url=http://localhost:9000
# sonar.token=YOUR_SONARQUBE_TOKEN
