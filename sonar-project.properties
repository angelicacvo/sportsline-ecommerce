# SonarQube Configuration
sonar.projectKey=angelicacvo_sportsline-ecommerce
sonar.organization=angelicacvo
sonar.projectName=Sportsline E-Commerce
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src
sonar.tests=test

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.e2e-spec.ts

# Test coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/main.ts,**/*.module.ts,**/*.dto.ts,**/*.entity.ts,**/*.interface.ts

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Host and authentication
# SonarCloud (no local setup needed - cloud service)
sonar.host.url=https://sonarcloud.io
# Token is read from SONAR_TOKEN environment variable
# Get your token from: https://sonarcloud.io/account/security
# Then add it to .env file: SONAR_TOKEN=your-token-here
