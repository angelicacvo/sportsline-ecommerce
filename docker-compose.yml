services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: jeferson
      POSTGRES_PASSWORD: JefersonKainToph
      POSTGRES_DB: sportsline
    ports:
      - "8326:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed.sql:/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeferson -d sportsline || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - microservices-network

  gateway:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: jeferson
      DATABASE_PASSWORD: JefersonKainToph
      DATABASE_NAME: sportsline
      USERS_SERVICE_HOST: users-service
      PRODUCTS_SERVICE_HOST: products-service
      ORDERS_SERVICE_HOST: orders-service
      CATEGORIES_SERVICE_HOST: categories-service
      ORDER_ITEMS_SERVICE_HOST: order-items-service
      JWT_SECRET: your-secret-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-key-change-in-production
      GOOGLE_CLIENT_ID: 640270787250-gjoi768v0rnmttpc82mlgenjud8r524i.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
    ports:
      - "3000:3000"
    command: node dist/src/gateway/main
    networks:
      - microservices-network

  users-service:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: jeferson
      DATABASE_PASSWORD: JefersonKainToph
      DATABASE_NAME: sportsline
    ports:
      - "4001:4001"
    command: node dist/src/users/main
    networks:
      - microservices-network

  products-service:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: jeferson
      DATABASE_PASSWORD: JefersonKainToph
      DATABASE_NAME: sportsline
    ports:
      - "4002:4002"
    command: node dist/src/products/main
    networks:
      - microservices-network

  orders-service:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: jeferson
      DATABASE_PASSWORD: JefersonKainToph
      DATABASE_NAME: sportsline
    ports:
      - "4003:4003"
    command: node dist/src/orders/main
    networks:
      - microservices-network

  categories-service:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: jeferson
      DATABASE_PASSWORD: JefersonKainToph
      DATABASE_NAME: sportsline
    ports:
      - "4004:4004"
    command: node dist/src/categories/main
    networks:
      - microservices-network

  order-items-service:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: jeferson
      DATABASE_PASSWORD: JefersonKainToph
      DATABASE_NAME: sportsline
    ports:
      - "4005:4005"
    command: node dist/src/orderItems/main
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
